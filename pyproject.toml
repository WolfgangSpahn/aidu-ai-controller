[project]
name = "aidu-ai-controller"
version = "0.1.0"
description = "A Python package for AIDu's AI controller."
readme = "README.md"
requires-python = ">=3.11,<3.15"

dependencies = [
    "aidu-support",
    "aidu-ai-llm",

    "rich==14.3.2",
    "pydantic>=2.0",
    "python-dotenv>=0.19.0,<1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sympy>=1.11.0,<2.0.0",
    "requests>=2.31.0",
    "uuid>=1.30"
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pluggy>=1.0",
    "ruff",
    "black",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = {"src" = ""}
packages = ["src/aidu/ai/controller"]

# -------------------------------------------------------------------
# Local workspace sources
# -------------------------------------------------------------------

[tool.uv.sources]
aidu-ai-llm = { path = "../aidu-ai-llm", editable = true }
aidu-support = { path = "../aidu-support", editable = true }

# Linter / formatter configuration
# Note: Makefile's `format` target runs Black first then Ruff format
# so Ruff can apply final fixes (for example, removing trailing commas).
# If you prefer to keep Black's formatting (including trailing commas),
# run `make format-black-only` which runs Black only.
[tool.ruff]
line-length = 180
exclude = ["__pycache__", "build", "dist", ".venv"]

[tool.black]
line-length = 180
target-version = ["py311"]