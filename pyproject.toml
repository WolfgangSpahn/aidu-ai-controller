[project]
name = "aidu-ai-controller"
version = "0.1.0"
description = "Controller runtime for the AIDu ecosystem."
readme = "README.md"
requires-python = ">=3.11,<3.15"

dependencies = [
    "aidu-support",
    "aidu-ai-llm",

    "pydantic>=2.0",
    "rich>=14.3.2",

    "python-dotenv>=0.19.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pluggy>=1.0",
    "ruff",
    "black",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = { "src" = "" }
packages = [
    "src/aidu/ai/controller",
]

# -------------------------------------------------------------------
# Local workspace sources
# -------------------------------------------------------------------

[tool.uv.sources]
aidu-ai-llm = { path = "../aidu-ai-llm", editable = true }
aidu-support = { path = "../aidu-support", editable = true }

# -------------------------------------------------------------------
# Linter / formatter configuration
# -------------------------------------------------------------------

[tool.ruff]
line-length = 180
exclude = ["__pycache__", "build", "dist", ".venv"]

[tool.black]
line-length = 180
target-version = ["py311"]